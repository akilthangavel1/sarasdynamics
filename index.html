<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saras Dynamics | AI Automation &amp; Digital Engineering</title>
    <meta name="description" content="Saras Dynamics engineers intelligent software, advanced AI architectures, and robust digital systems. Combining technical depth with uncompromising craftsmanship." />
    <meta property="og:title" content="Saras Dynamics | AI Automation &amp; Digital Engineering" />
    <meta property="og:description" content="Saras Dynamics engineers intelligent software, advanced AI architectures, and robust digital systems." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/saras-dynamics-logo.png" />
    <link rel="apple-touch-icon" href="/saras-dynamics-logo.png" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme') || localStorage.getItem('saras_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  </body>
</html>
